doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                url: '%env(resolve:DATABASE_URL)%'
                profiling_collect_backtrace: '%kernel.debug%'
                dbname_suffix: '%app.database_suffix%'
            # The advisory locks of config/packages/lock.yaml, in a database session of their own (D39, D58).
            lock:
                url: '%env(resolve:DATABASE_URL)%'
                profiling_collect_backtrace: '%kernel.debug%'
                dbname_suffix: '%app.database_suffix%'
        types:
            App\Domain\Identity\ApiTokenId: App\Doctrine\Type\IdentifierType
            App\Domain\Identity\BatchId: App\Doctrine\Type\IdentifierType
            App\Domain\Identity\CommentId: App\Doctrine\Type\IdentifierType
            App\Domain\Identity\DraftId: App\Doctrine\Type\IdentifierType
            App\Domain\Identity\EventId: App\Doctrine\Type\IdentifierType
            App\Domain\Identity\GitHubCandidateId: App\Doctrine\Type\IdentifierType
            App\Domain\Identity\GitHubInstallationId: App\Doctrine\Type\IdentifierType
            App\Domain\Identity\RepositoryId: App\Doctrine\Type\IdentifierType
            App\Domain\Identity\RequestId: App\Doctrine\Type\IdentifierType
            App\Domain\Identity\ReviewId: App\Doctrine\Type\IdentifierType
            App\Domain\Identity\TenantId: App\Doctrine\Type\IdentifierType
            App\Domain\Identity\UserId: App\Doctrine\Type\IdentifierType
            App\Domain\Identity\ViewedFileId: App\Doctrine\Type\IdentifierType
            App\Domain\Git\BlobSha: App\Doctrine\Type\StringValueType
            App\Domain\Git\CommitSha: App\Doctrine\Type\StringValueType
            App\Domain\Git\RepoPath: App\Doctrine\Type\StringValueType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            Embeddable:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Doctrine/Embeddable'
                prefix: 'App\Doctrine\Embeddable'
                alias: Embeddable
        dql:
            string_functions:
                JSONB_CONTAINS: App\Doctrine\Query\JsonbContains
                JSONB_PATH_TEXT: App\Doctrine\Query\JsonbPathText
            numeric_functions:
                JSONB_PATH_INTEGER: App\Doctrine\Query\JsonbPathInteger
        filters:
            tenant:
                class: App\Tenancy\TenantSqlFilter
                enabled: true
            repository_scope:
                class: App\Tenancy\RepositoryScopeSqlFilter
                enabled: false

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
