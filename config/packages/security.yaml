security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        tenant_users:
            id: App\Security\TenantUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api/v1
            lazy: true
            context: web
            provider: tenant_users
            entry_point: App\Security\ApiAuthenticationEntryPoint
        main:
            lazy: true
            context: web
            provider: tenant_users
            entry_point: App\Security\LoginRedirectEntryPoint
            # Guarded in code: environment-specific firewall blocks do not merge.
            custom_authenticators:
                - App\Security\LocalSignInAuthenticator
            # D23. The check path route answers 404 without a GitHub App.
            oauth:
                resource_owners:
                    github: /login/check-github
                login_path: app_login
                oauth_user_provider:
                    service: App\Security\GitHubUserProvider
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true

    # Note: Only the *first* matching rule is applied
    access_control:
        # 401 on kernel.request, before a value resolver reads a path ID without a tenant context.
        - { path: ^/api/v1, roles: IS_AUTHENTICATED }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
