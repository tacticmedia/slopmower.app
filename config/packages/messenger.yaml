framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default:
                middleware:
                    - App\Messenger\TenantContextMiddleware

        routing:
            # The GitHub webhook consumer. The response is 202 before the work runs.
            'Symfony\Component\RemoteEvent\Messenger\ConsumeRemoteEventMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'

when@e2e:
    framework:
        messenger:
            transports:
                async: 'sync://'

when@dev:
    framework:
        messenger:
            transports:
                async:
                    options:
                        # A message that a crashed worker held returns after 15 minutes, not 1 hour; above the 600 s git timeout.
                        redeliver_timeout: 900
                        # The idle worker checks the messenger:stop-workers signal every 2 s, not every 60 s, between LISTEN waits.
                        get_notify_timeout: 2000
