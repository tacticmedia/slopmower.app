framework:
    assets:
        json_manifest_path: '%kernel.project_dir%/public/build/manifest.json'

when@prod:
    reprise:
        # In prod we'd rather render nothing than let a missing entrypoints.json (or entry) take the app down with a 500.
        strict_mode: false

        # Cache the entrypoints.json (rebuild Symfony's cache when entrypoints.json changes)
        cache: true

# The functional and full-stack tests read the build of `npm run build:e2e`.
when@test: &build_e2e
    reprise:
        output_path: '%kernel.project_dir%/public/build-e2e'
    framework:
        assets:
            json_manifest_path: '%kernel.project_dir%/public/build-e2e/manifest.json'

when@e2e: *build_e2e
