mercure:
    hubs:
        default:
            # D41: without a URL the bundle compiles FrankenPhpHub, which calls mercure_publish(), disabled in 10-app.ini.
            url: '%env(MERCURE_URL)%'
            public_url: '%env(MERCURE_PUBLIC_URL)%'
            jwt:
                secret: '%env(MERCURE_JWT_SECRET)%'
                publish: '*'
