# D67: server errors only, without request bodies, frame arguments, cookies, IP addresses, or user data.
when@prod:
    sentry:
        dsn: '%env(SENTRY_DSN)%'
        # Also stops the trace headers that the HTTP client adds to the requests to GitHub and the symbols service.
        tracing: false
        options:
            # The same values as the browser SDK of templates/base.html.twig (D86).
            release: '%env(default::APP_RELEASE)%'
            environment: '%env(default:kernel.environment:SENTRY_ENVIRONMENT)%'
            before_send: App\Http\SentryClientErrorFilter
            ignore_exceptions:
                - 'Symfony\Component\ErrorHandler\Error\FatalError'
                - 'Symfony\Component\Debug\Exception\FatalErrorException'
            # Each option that is left out collects.
            data_collection:
                user_info: false
                cookies: { mode: 'off' }
                # The request integration sanitizes no forwarded IP header in this mode.
                http_headers: { terms: [forwarded, x-real-ip, client-ip, connecting-ip] }
                http_bodies: []
                # Search texts, names, and confirmations of the REST API, and the OAuth code of the sign-in.
                url_query_params: { terms: [q, name, confirm, code] }
                stack_frame_variables: false
                database_query_data: false
                queues: false
                gen_ai: { inputs: false, outputs: false }
