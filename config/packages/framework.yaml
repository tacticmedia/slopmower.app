# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler

    # Domain errors are answers to the client, not failures of the server.
    exceptions:
        App\Domain\Error\DomainError:
            log_level: info

    http_client:
        scoped_clients:
            github.client:
                scope: '^https://(api\.)?github\.com/'
                timeout: 10

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        http_client:
            mock_response_factory: App\Tests\Support\GitHub\GitHubResponses

# A browser session needs real session storage (D34).
when@e2e:
    framework:
        session:
            storage_factory_id: session.storage.factory.native
