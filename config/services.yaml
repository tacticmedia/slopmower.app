# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Used by doctrine.dbal.dbname_suffix and the session DSN.
    app.database_suffix: ''
    # Message classes that the worker handles without a TenantStamp and without a tenant context.
    app.tenantless_messages: []

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Its own connection, opened at session start and closed at session save, so a worker never keeps a dead one.
    # The advisory lock serializes the requests of one session, so no request writes back a session that logout deleted.
    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            $pdoOrDsn: 'pgsql:host=%env(key:host:url:DATABASE_URL)%;port=%env(key:port:url:DATABASE_URL)%;dbname=%env(key:path:url:DATABASE_URL)%%app.database_suffix%'
            $options:
                db_username: '%env(key:user:url:DATABASE_URL)%'
                db_password: '%env(key:pass:url:DATABASE_URL)%'
                lock_mode: !php/const Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler::LOCK_ADVISORY

    # The bundle builds its own client. A framework client honours framework.http_client.mock_response_factory.
    hwi_oauth.http_client: '@github.client'

when@test:
    parameters:
        # "TEST_TOKEN" is typically set by ParaTest
        app.database_suffix: '_test%env(default::TEST_TOKEN)%'
        app.tenantless_messages: ['App\Tests\Support\Messenger\TenantlessProbe']

    services:
        App\Tests\Support\GitHub\GitHubResponses: ~
        App\Tests\Support\Messenger\TenantProbeHandler:
            autowire: true
            autoconfigure: true

when@e2e:
    parameters:
        app.database_suffix: '_test'
