# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    # Used by doctrine.dbal.dbname_suffix.
    app.database_suffix: ''
    # Message classes that the worker handles without a TenantStamp and without a tenant context.
    app.tenantless_messages: ['Symfony\Component\RemoteEvent\Messenger\ConsumeRemoteEventMessage']
    # The usage limits of each plan, docs/specs/README.md section "Usage limits". Every tenant has the free plan.
    app.plans:
        free:
            repositories: '%env(int:default::APP_PLAN_FREE_REPOSITORIES)%'
            open_reviews: '%env(int:default::APP_PLAN_FREE_OPEN_REVIEWS)%'
            requests_per_review: '%env(int:default::APP_PLAN_FREE_REQUESTS_PER_REVIEW)%'
            repository_size_mib: '%env(int:default::APP_PLAN_FREE_REPOSITORY_SIZE_MIB)%'
            tenant_storage_mib: '%env(int:default::APP_PLAN_FREE_TENANT_STORAGE_MIB)%'
    # The MCP server instructions, docs/specs/mcp.md section 2.
    app.mcp_instructions: |-
        Slopmower stores change requests that the user wrote while reviewing this repository at a pinned commit. Each request asks for one change and belongs to exactly one review; several reviews can be open at once.

        1. Identify the repository: owner/name from `git remote get-url origin` for GitHub, or the name of the repository's root directory for a local repository. list_repositories shows what this token can see.
        2. list_reviews(repository) returns the open reviews. Work on the one the user named; if several are open and none was named, ask.
        3. get_updates(review) without a cursor returns what waits for you. Keep the returned cursor and pass it in the next call; if hasMore is true, call again at once.
        4. For each request with awaiting "agent", reopened ones first: get_request, then reply_to_request (question: true when you need an answer, then move on), or claim_request before you edit code.
        5. When requireApproval is true, or the request is unclear or large, propose_solution after the claim and take the next request. The decision comes back through get_updates. Link no commit before proposal.state is approved; on "rejected", read the note and propose again.
        6. Commit per request, then link_commits with the full SHA and every request that the commit covers. GitHub repositories: push before mark_ready_for_review. Local repositories: committing is enough. If you opened a pull request for the work, link_pull_request with its URL and every request that it covers; unlink_pull_request removes a link made by mistake.
        7. Finish with mark_ready_for_review (what changed, how you tested it), or mark_wont_do with evidence the user can check, or release_request if you stop.

        Never verify, reopen, create requests, or decide on proposals. Errors are isError results whose text is {"error":{"code","message","details"}}. On invalid_transition call get_request and read allowedActions and proposal. On review_closed stop working on that review.

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    # The bundle builds its own client. The alias makes it use github.client, whose mock_response_factory the test environment sets.
    hwi_oauth.http_client: '@github.client'

    # docs/user renders as on GitHub. twig/extra-bundle adds every CommonMark extension with this tag to markdown_to_html.
    League\CommonMark\Extension\GithubFlavoredMarkdownExtension:
        tags: ['twig.markdown.league_extension']

when@test:
    parameters:
        # "TEST_TOKEN" is typically set by ParaTest. TEST_DATABASE_SUFFIX is "_e2e" in tests/E2E, see E2eDatabaseExtension.
        app.database_suffix: '%env(default:app.test_database_suffix:TEST_DATABASE_SUFFIX)%%env(default::TEST_TOKEN)%'
        app.test_database_suffix: '_test'
        app.tenantless_messages: ['Symfony\Component\RemoteEvent\Messenger\ConsumeRemoteEventMessage', 'App\Tests\Support\Messenger\TenantlessProbe']

    services:
        App\Tests\Support\GitHub\GitHubResponses: ~
        # The mock transport of github.client, for the GitHub request counts. A test cannot get a service whose ID starts with a dot.
        github.client.mock_transport: '@.http_client.mock_transport.App\Tests\Support\GitHub\GitHubResponses'
        App\Tests\Support\Messenger\TenantProbeHandler:
            autowire: true
            autoconfigure: true

when@e2e:
    parameters:
        app.database_suffix: '_e2e'
