# Shannon configuration of make pentest (F122). Schema: apps/worker/configs/config-schema.json of KeygraphHQ/shannon v3.5.0.

description: "Slopmower: code review between a developer and a coding agent. Symfony JSON API at /api/v1, MCP server at /_mcp, React SPA, PostgreSQL, Mercure. A disposable local stack in APP_ENV=dev with synthetic data."

rules_of_engagement: |
  - Send requests only to https://host.docker.internal:8343. The other ports of host.docker.internal belong to other applications.
  - The "Sign in as pentest" button (POST /login/local) is a dev-only stand-in for GitHub sign-in that production does not have. Use it to sign in. Do not test, exploit, or report it.

authentication:
  login_type: form
  login_url: "https://host.docker.internal:8343/login"
  credentials:
    username: pentest
  login_flow:
    - "Click the 'Sign in as pentest' button"
  success_condition:
    type: url_contains
    value: "/repositories"

rules:
  avoid:
    - description: "Logout ends the session"
      type: url_path
      value: "/logout"
    - description: "Symfony profiler, dev only"
      type: url_path
      value: "/_profiler"
    - description: "Symfony debug toolbar, dev only"
      type: url_path
      value: "/_wdt"
    - description: "QA screenshot review, dev only"
      type: url_path
      value: "/_dev"
    # No code_path rule for .claude/: Shannon also denies it under any parent, which blocks its own /tmp/.claude/skills.

report:
  guidance: "Drop findings about dev-only surfaces that production does not have: the local sign-in without a password, the Symfony profiler, debug error pages, and the values in .env.dev. Keep findings about the defaults in .env."
