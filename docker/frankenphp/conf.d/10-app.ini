expose_php = 0
date.timezone = UTC
session.use_strict_mode = 1
zend.detect_unicode = 0
; Only FrankenPHP defines it, and the Mercure bundle changes its configuration tree when it exists. Without it, FrankenPHP
; and the CLI build the same container and config/reference.php. The app publishes through the hub URL (D41).
disable_functions = mercure_publish

; https://symfony.com/doc/current/performance.html
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
opcache.memory_consumption = 256
opcache.enable_file_override = 1
