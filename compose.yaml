# Maintained by hand: extra.symfony.docker is false (D35). Local development only.

x-php: &php
  build:
    context: .
    target: frankenphp_dev
  restart: unless-stopped
  volumes:
    - .:/app
    - tenant_data:/srv/tenants
    - ${LOCAL_REPOSITORIES_HOST_DIR:-./var/local-repositories}:/repositories:ro
    - caddy_data:/data
    - caddy_config:/config
    - playwright_browsers:/ms-playwright

services:
  php:
    <<: *php
    depends_on:
      database:
        condition: service_healthy
    environment:
      SERVER_NAME: ':80'
      HTTP_PORT: ${HTTP_PORT:-8000}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
      APP_LOCAL_SIGN_IN: ${APP_LOCAL_SIGN_IN:-}
    ports:
      - 127.0.0.1:${HTTP_PORT:-8000}:80
    healthcheck:
      test: ["CMD", "php", "-r", "exit(false === @file_get_contents('http://localhost/healthz') ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
      start_interval: 2s

  worker:
    <<: *php
    command: ["bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    depends_on:
      php:
        condition: service_healthy
    environment:
      MERCURE_URL: http://php/.well-known/mercure
      # Its own container build: a rebuild of the shared var/cache by the php container removes files that a running
      # worker still loads. Cache pools stay shared in APP_SHARE_DIR, so messenger:stop-workers reaches it.
      APP_CACHE_DIR: var/cache/worker
    # The upstream image checks the Caddy admin endpoint, which the worker does not run.
    healthcheck:
      disable: true

  database:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      # PostgreSQL 18 keeps its data under /var/lib/postgresql/18/docker.
      - database_data:/var/lib/postgresql

volumes:
  caddy_config:
  caddy_data:
  database_data:
  playwright_browsers:
  tenant_data:
